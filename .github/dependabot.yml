version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # TODO: remove these ignores when upstream unblocks:
    # @astrojs/check and typescript-eslint both need releases that run on
    # typescript 7 (they wait on the typescript 7.1 API), and
    # eslint-plugin-jsx-a11y needs a release accepting eslint 10
    # (eslint-plugin-astro 2+ requires eslint 10, so it waits on the same).
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
      - dependency-name: eslint
        versions: [">=10"]
      - dependency-name: eslint-plugin-astro
        versions: [">=2"]
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
