version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # TODO: remove this ignore when upstream unblocks:
    # @astrojs/check and typescript-eslint both need releases that run on
    # typescript 7 (they wait on the typescript 7.1 API).
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
